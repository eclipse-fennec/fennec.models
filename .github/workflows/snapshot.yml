name: Snapshot Build

on:
  push:
    branches:
      - snapshot

# Workflow-level ceiling for the called reusables. The credential-scoped release
# step gets its secrets via `secrets: inherit` below (verify never sees them).
permissions:
  contents: read

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  # Publishes -SNAPSHOT to Sonatype (DO_RELEASE=false). `needs: verify` is what gates
  # it: nothing is published until the license gate and BOTH JDKs are green.
  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0
    with:
      do-release: false
      # Publish with JDK 21, as the hand-written workflow did before the migration.
      publish-java-version: '21'
    secrets: inherit
