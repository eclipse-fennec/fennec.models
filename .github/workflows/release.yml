name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. The credential-scoped release
# step gets its secrets via `secrets: inherit` below (verify never sees them).
permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0

  # Publishes to Maven Central (DO_RELEASE=true). Same reusable and same Gradle
  # `release` task as the snapshot path — only the flag differs.
  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0
    with:
      do-release: true
      # Publish with JDK 21, as the hand-written workflow did before the migration.
      publish-java-version: '21'
    secrets: inherit
